[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-engine"
version = "0.1.0"
description = "Multi-Chain Autonomous Crypto Trading Swarm & Ruflo Multi-Agent Orchestration Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Principal Quantitative Systems Team" }
]
keywords = ["ruflo", "multi-agent", "swarm", "crypto", "trading", "solana", "base", "evm", "svm"]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "websockets>=12.0",
    "web3>=6.0.0",
    "telethon>=1.34.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "base58>=2.1.0",
    "solders>=0.21.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
]

[project.scripts]
alpha-engine = "alpha_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alpha_engine*"]

[tool.pytest.ini_options]
addopts = "-p anyio"

