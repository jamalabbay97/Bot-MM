[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-engine"
version = "0.1.0"
description = "Multi-Chain Paper Trading & Alpha Analytics Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Principal Quantitative Systems Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "websockets>=12.0",
    "web3>=6.0.0",
]

[project.scripts]
alpha-engine = "alpha_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alpha_engine*"]
